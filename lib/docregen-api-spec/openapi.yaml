openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DocRegen API - Medicina Regenerativa e Dor (independente do DocKnee)
servers:
  - url: /regen-api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: doctors
    description: Doctor management
  - name: patients
    description: Patient management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerDoctor
      tags: [auth]
      summary: Register a new doctor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDoctorBody"
      responses:
        "201":
          description: Doctor registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginDoctor
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutDoctor
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentDoctor
      tags: [auth]
      summary: Get current logged in doctor
      responses:
        "200":
          description: Current doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "204":
          description: No active doctor session
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /doctors/{id}:
    get:
      operationId: getDoctor
      tags: [doctors]
      summary: Get doctor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDoctor
      tags: [doctors]
      summary: Update doctor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDoctorBody"
      responses:
        "200":
          description: Updated doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patients for the current doctor
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientBody"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientBody"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Delete patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    RegisterDoctorBody:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 8
          description: At least 8 characters (same rule as password reset/change)
        cpf:
          type: string
          description: Valid Brazilian CPF (checksum verified server-side); required for Brazilian doctors
        estrangeiro:
          type: boolean
        paisOrigem:
          type: string
        crm:
          type: string
        crmEstado:
          type: string
        telefone:
          type: string
        dataNascimento:
          type: string
          nullable: true
          description: Data de nascimento (YYYY-MM-DD)
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
        especialidade:
          type: string
        idioma:
          type: string
          enum: [pt-BR, es]
          default: pt-BR
      required: [nome, email, senha]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        senha:
          type: string
      required: [email, senha]

    AuthResponse:
      type: object
      properties:
        doctor:
          $ref: "#/components/schemas/Doctor"
      required: [doctor]

    Doctor:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        crm:
          type: string
        crmEstado:
          type: string
        telefone:
          type: ["string", "null"]
        cpf:
          type: string
        dataNascimento:
          type: ["string", "null"]
          description: Data de nascimento (YYYY-MM-DD)
        endereco:
          type: ["string", "null"]
        cidade:
          type: ["string", "null"]
        estado:
          type: ["string", "null"]
        cep:
          type: ["string", "null"]
        especialidade:
          type: ["string", "null"]
        idioma:
          type: string
          enum: [pt-BR, es]
          default: pt-BR
        whatsappBusiness:
          type: ["string", "null"]
          description: Número WhatsApp Business do médico (com DDD, somente dígitos)
        isAdmin:
          type: boolean
        createdAt:
          type: string
      required: [id, nome, email, crm, crmEstado, cpf, idioma, isAdmin, createdAt]

    UpdateDoctorBody:
      type: object
      properties:
        nome:
          type: string
        crm:
          type: string
        crmEstado:
          type: string
        telefone:
          type: string
        dataNascimento:
          type: string
          nullable: true
          description: Data de nascimento (YYYY-MM-DD)
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
        especialidade:
          type: string
        idioma:
          type: string
          enum: [pt-BR, es]
        whatsappBusiness:
          type: string
          nullable: true
          description: Número WhatsApp Business do médico (com DDD, somente dígitos)

    Patient:
      type: object
      properties:
        id:
          type: integer
        doctorId:
          type: integer
        nome:
          type: string
        dataNascimento:
          type: ["string", "null"]
        sexo:
          type: ["string", "null"]
        telefone:
          type: ["string", "null"]
        lado:
          type: ["string", "null"]
        nivelAtividade:
          type: ["string", "null"]
        beightonScore:
          type: ["integer", "null"]
        createdAt:
          type: string
      required: [id, doctorId, nome, createdAt]

    CreatePatientBody:
      type: object
      properties:
        nome:
          type: string
        cpf:
          type: string
        dataNascimento:
          type: string
        email:
          type: string
        sexo:
          type: string
        telefone:
          type: string
        lado:
          type: string
        nivelAtividade:
          type: string
        beightonScore:
          type: integer
        planoSaude:
          type: string
        indicadoPor:
          type: string
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
      required: [nome]

    UpdatePatientBody:
      type: object
      properties:
        nome:
          type: string
        cpf:
          type: string
        dataNascimento:
          type: string
        email:
          type: string
        sexo:
          type: string
        telefone:
          type: string
        lado:
          type: string
        nivelAtividade:
          type: string
        beightonScore:
          type: integer
        anamnese:
          type: string
          nullable: true
        laudos:
          type: string
          nullable: true
        planoSaude:
          type: string
        indicadoPor:
          type: string
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
