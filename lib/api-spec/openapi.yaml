openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DocSholder API - Plataforma de Documentação Cirúrgica de Ombro e Cotovelo
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: doctors
    description: Doctor management
  - name: patients
    description: Patient management
  - name: surgeries
    description: Surgery documentation
  - name: followup
    description: Follow-up records
  - name: reports
    description: Dashboard and reports
  - name: admin
    description: Administrative analytics
  - name: apoio-decisao
    description: Literature-based decision support (suggestions only; the decision is the surgeon's)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerDoctor
      tags: [auth]
      summary: Register a new doctor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDoctorBody"
      responses:
        "201":
          description: Doctor registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginDoctor
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutDoctor
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentDoctor
      tags: [auth]
      summary: Get current logged in doctor
      responses:
        "200":
          description: Current doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "204":
          description: No active doctor session
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /doctors:
    get:
      operationId: listDoctors
      tags: [doctors]
      summary: List all doctors (admin only)
      responses:
        "200":
          description: List of doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DoctorWithStats"

  /doctors/{id}:
    get:
      operationId: getDoctor
      tags: [doctors]
      summary: Get doctor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDoctor
      tags: [doctors]
      summary: Update doctor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDoctorBody"
      responses:
        "200":
          description: Updated doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patients for the current doctor
      description: >-
        Médico ou secretária. Para a secretária (LGPD Art. 11, minimização) a lista traz apenas dados
        cadastrais/administrativos: `surgeries` e os campos clínicos do cadastro são omitidos.
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientWithSurgeries"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientBody"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientWithSurgeries"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientBody"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Delete patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /surgeries:
    get:
      operationId: listSurgeries
      tags: [surgeries]
      summary: List surgeries for current doctor
      responses:
        "200":
          description: List of surgeries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurgeryWithPatient"
    post:
      operationId: createSurgery
      tags: [surgeries]
      summary: Create a new surgery record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSurgeryBody"
      responses:
        "201":
          description: Surgery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surgery"

  /surgeries/{id}:
    get:
      operationId: getSurgery
      tags: [surgeries]
      summary: Get surgery full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Surgery full details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurgeryDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSurgery
      tags: [surgeries]
      summary: Update surgery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSurgeryBody"
      responses:
        "200":
          description: Updated surgery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surgery"
    delete:
      operationId: deleteSurgery
      tags: [surgeries]
      summary: Delete surgery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted




  /followup:
    post:
      operationId: createFollowup
      tags: [followup]
      summary: Create a follow-up record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFollowupBody"
      responses:
        "201":
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Followup"

  /followup/{surgeryId}:
    get:
      operationId: listFollowup
      tags: [followup]
      summary: List follow-ups for a surgery
      parameters:
        - name: surgeryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of follow-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Followup"

  /followup/{id}/update:
    patch:
      operationId: updateFollowup
      tags: [followup]
      summary: Update a follow-up record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFollowupBody"
      responses:
        "200":
          description: Updated follow-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Followup"

  /followup/{id}/clinician-scales:
    put:
      operationId: updateFollowupClinicianScales
      tags: [followup]
      summary: Record or update clinician-completed scales (Constant-Murley, Rowe) on a follow-up
      description: |
        The server validates each scale against the surgery (only scales applicable to its
        pathologies and with a free license are accepted) and scores it with the clinical
        package; any client-sent score is ignored.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClinicianScalesBody"
      responses:
        "200":
          description: Clinician scales recorded for the follow-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianScalesResult"
        "400":
          description: Invalid id, body or scale item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Follow-up not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Pre-operative follow-up of a fracture surgery is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Scale not applicable to this surgery or not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/dashboard:
    get:
      operationId: getDoctorDashboard
      tags: [reports]
      summary: Get dashboard stats for the current doctor
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorDashboard"

  /reports/admin:
    get:
      operationId: getAdminDashboard
      tags: [reports]
      summary: Get global admin dashboard (admin only)
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get aggregated admin analytics (admin only)
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d, 12m]
            default: 30d
      responses:
        "200":
          description: Aggregated analytics, utilization cohorts, and navigation click ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  /apoio-decisao/algoritmos:
    get:
      operationId: listApoioDecisaoAlgoritmos
      tags: [apoio-decisao]
      summary: List decision-support algorithms visible to the current doctor
      description: |
        Admins see every algorithm version in the code, whatever its status and whatever the
        `apoio_decisao` feature flag. Other doctors see only versions whose status is `ativo`,
        and only while the `apoio_decisao` feature flag is enabled (default: off).
        A version without a status row, or whose last status row was recorded for a different
        content hash, is `rascunho`.
      responses:
        "200":
          description: Visible algorithm versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApoioDecisaoAlgoritmoList"
        "401":
          description: Authentication required

  /apoio-decisao/algoritmos/{algoritmoId}/{versao}/avaliar:
    post:
      operationId: avaliarApoioDecisao
      tags: [apoio-decisao]
      summary: Evaluate a decision-support algorithm on the server and store the execution
      description: |
        The server evaluates the input with the clinical engine and stores the execution
        (insert-only audit trail). Any client-sent result is ignored. The output is always a
        suggestion labelled "Sugestão". Evaluating a version that is not `ativo` (admins only),
        or any version with `revisao: true` (admins only), is stored with mode `revisao` and
        cannot be linked to a patient or surgery.

        With `surgeryId`, the server loads the surgery's clinical data and the patient's birth
        date (owner only), maps them to the algorithm inputs and merges the client `entrada` as
        manual values: a manual value never overrides the record, and each divergence is
        returned and stored in `conflitos`. Client `parametros` (threshold overrides) are
        applied only for an admin in mode `revisao`; otherwise they are ignored. The resolved
        parameters are always stored in `resultado.parametros`.
      parameters:
        - name: algoritmoId
          in: path
          required: true
          schema:
            type: string
        - name: versao
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvaliarApoioDecisaoBody"
      responses:
        "201":
          description: Execution stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApoioDecisaoExecucao"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Algorithm, patient or surgery not found or not visible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Review mode requested by a non-admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Implausible or unknown input, or a review run linked to a patient or surgery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apoio-decisao/execucoes/{id}/escolha:
    post:
      operationId: registrarEscolhaApoioDecisao
      tags: [apoio-decisao]
      summary: Record the surgeon's choice for a stored execution
      description: |
        Insert-only; the latest choice for an execution prevails. Exactly one of `opcao`
        (an option id of the algorithm) or `outra` (free text) is required. The agreement with
        the suggestion is computed by the server. Review-mode executions are refused.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarEscolhaApoioDecisaoBody"
      responses:
        "201":
          description: Choice stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApoioDecisaoEscolha"
        "400":
          description: Invalid body or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Review-mode execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Option does not belong to the algorithm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apoio-decisao/algoritmos/{algoritmoId}/{versao}/status:
    get:
      operationId: listStatusApoioDecisao
      tags: [apoio-decisao]
      summary: Status history of an algorithm version (admin only)
      description: |
        Insert-only history, newest first. Each row carries the content hash it was recorded for;
        a row whose hash differs from the running code does not count as the current status.
      parameters:
        - name: algoritmoId
          in: path
          required: true
          schema:
            type: string
        - name: versao
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApoioDecisaoStatusHistorico"
        "403":
          description: Admin access required
        "404":
          description: Unknown algorithm version (not in the code and without history)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: alterarStatusApoioDecisao
      tags: [apoio-decisao]
      summary: Change the status of an algorithm version (admin only)
      description: |
        Allowed transitions: rascunho → revisado, revisado → rascunho | ativo, ativo → aposentado.
        Refused with 409 when `hash` differs from the hash of the code currently running, so a
        version can only be activated exactly as it was reviewed. Activating a version retires
        the previously active version of the same algorithm.
      parameters:
        - name: algoritmoId
          in: path
          required: true
          schema:
            type: string
        - name: versao
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlterarStatusApoioDecisaoBody"
      responses:
        "201":
          description: Status recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApoioDecisaoStatusRegistro"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
        "404":
          description: Algorithm version not found in the running code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Hash differs from the running code, or the content lock is out of date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transition not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apoio-decisao/cirurgias/{surgeryId}/execucoes:
    get:
      operationId: listExecucoesApoioDecisaoCirurgia
      tags: [apoio-decisao]
      summary: Decision-support executions linked to a surgery, with the latest surgeon choice
      description: |
        Only the surgery's owner can list them. Newest first. Each execution carries the stored
        result (always a suggestion) and the latest recorded choice, if any.
      parameters:
        - name: surgeryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Linked executions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApoioDecisaoExecucoesCirurgia"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
        "404":
          description: Surgery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    AdminAnalytics:
      type: object
      description: Existing admin analytics envelope with the usage fields below.
      additionalProperties: true
      properties:
        usageFunnel:
          $ref: "#/components/schemas/AdminUsageFunnel"
        navigationClickRanking:
          $ref: "#/components/schemas/AdminNavigationClickRanking"
      required: [usageFunnel, navigationClickRanking]

    AdminUsageFunnel:
      type: object
      properties:
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
            timezone:
              type: string
            bounds:
              type: string
              example: "inclusive [start, end] UTC"
          required: [start, end, timezone, bounds]
        coverage:
          type: object
          properties:
            documentationSources:
              type: array
              items: { type: string }
            clickSource:
              type: string
            documentationLimitations:
              type: array
              items: { type: string }
            start:
              type: ["string", "null"]
              format: date-time
            empty:
              type: boolean
            unavailableReason:
              type: string
          required: [documentationSources, clickSource, documentationLimitations, start, empty]
        activeDoctors:
          type: integer
        enteredWithoutDocumentationDoctors:
          type: integer
        documentedDoctors:
          type: integer
        enteredWithoutDocumentationDoctorList:
          type: array
          items:
            $ref: "#/components/schemas/AdminDoctorIdentity"
      required: [period, coverage, activeDoctors, enteredWithoutDocumentationDoctors, documentedDoctors, enteredWithoutDocumentationDoctorList]

    AdminDoctorIdentity:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
      required: [name, email]

    AdminNavigationClickRanking:
      type: object
      properties:
        bounds:
          type: string
          example: "inclusive [period.start, period.end] UTC"
        coverageStart:
          type: ["string", "null"]
          format: date-time
        empty:
          type: boolean
        unavailableReason:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              route:
                type: string
              feature:
                type: string
              count:
                type: integer
              uniqueDoctors:
                type: integer
            required: [route, feature, count, uniqueDoctors]
      required: [bounds, coverageStart, empty, items]

    RegisterDoctorBody:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
        senha:
          type: string
        estrangeiro:
          type: boolean
        paisOrigem:
          type: string
        crm:
          type: string
        crmEstado:
          type: string
        telefone:
          type: string
        cpf:
          type: string
        dataNascimento:
          type: string
          nullable: true
          description: Data de nascimento (YYYY-MM-DD)
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
        especialidade:
          type: string
        idioma:
          type: string
          enum: [pt-BR, es]
          default: pt-BR
      required: [nome, email, senha]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        senha:
          type: string
      required: [email, senha]

    AuthResponse:
      type: object
      properties:
        doctor:
          $ref: "#/components/schemas/Doctor"
      required: [doctor]

    Doctor:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        crm:
          type: string
        crmEstado:
          type: string
        telefone:
          type: ["string", "null"]
        cpf:
          type: string
        dataNascimento:
          type: ["string", "null"]
          description: Data de nascimento (YYYY-MM-DD)
        endereco:
          type: ["string", "null"]
