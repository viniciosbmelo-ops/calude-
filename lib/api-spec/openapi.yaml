openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DocSholder API - Plataforma de Documentação Cirúrgica de Ombro e Cotovelo
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: doctors
    description: Doctor management
  - name: patients
    description: Patient management
  - name: surgeries
    description: Surgery documentation
  - name: followup
    description: Follow-up records
  - name: reports
    description: Dashboard and reports
  - name: admin
    description: Administrative analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerDoctor
      tags: [auth]
      summary: Register a new doctor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDoctorBody"
      responses:
        "201":
          description: Doctor registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginDoctor
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutDoctor
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentDoctor
      tags: [auth]
      summary: Get current logged in doctor
      responses:
        "200":
          description: Current doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "204":
          description: No active doctor session
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /doctors:
    get:
      operationId: listDoctors
      tags: [doctors]
      summary: List all doctors (admin only)
      responses:
        "200":
          description: List of doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DoctorWithStats"

  /doctors/{id}:
    get:
      operationId: getDoctor
      tags: [doctors]
      summary: Get doctor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDoctor
      tags: [doctors]
      summary: Update doctor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDoctorBody"
      responses:
        "200":
          description: Updated doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patients for the current doctor
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientWithSurgeries"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientBody"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientWithSurgeries"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientBody"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Delete patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /surgeries:
    get:
      operationId: listSurgeries
      tags: [surgeries]
      summary: List surgeries for current doctor
      responses:
        "200":
          description: List of surgeries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurgeryWithPatient"
    post:
      operationId: createSurgery
      tags: [surgeries]
      summary: Create a new surgery record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSurgeryBody"
      responses:
        "201":
          description: Surgery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surgery"

  /surgeries/{id}:
    get:
      operationId: getSurgery
      tags: [surgeries]
      summary: Get surgery full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Surgery full details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurgeryDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSurgery
      tags: [surgeries]
      summary: Update surgery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSurgeryBody"
      responses:
        "200":
          description: Updated surgery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surgery"
    delete:
      operationId: deleteSurgery
      tags: [surgeries]
      summary: Delete surgery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted




  /followup:
    post:
      operationId: createFollowup
      tags: [followup]
      summary: Create a follow-up record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFollowupBody"
      responses:
        "201":
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Followup"

  /followup/{surgeryId}:
    get:
      operationId: listFollowup
      tags: [followup]
      summary: List follow-ups for a surgery
      parameters:
        - name: surgeryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of follow-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Followup"

  /followup/{id}/update:
    patch:
      operationId: updateFollowup
      tags: [followup]
      summary: Update a follow-up record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFollowupBody"
      responses:
        "200":
          description: Updated follow-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Followup"

  /reports/dashboard:
    get:
      operationId: getDoctorDashboard
      tags: [reports]
      summary: Get dashboard stats for the current doctor
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorDashboard"

  /reports/admin:
    get:
      operationId: getAdminDashboard
      tags: [reports]
      summary: Get global admin dashboard (admin only)
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get aggregated admin analytics (admin only)
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d, 12m]
            default: 30d
      responses:
        "200":
          description: Aggregated analytics, utilization cohorts, and navigation click ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
        "401":
          description: Authentication required
        "403":
          description: Admin access required

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    AdminAnalytics:
      type: object
      description: Existing admin analytics envelope with the usage fields below.
      additionalProperties: true
      properties:
        usageFunnel:
          $ref: "#/components/schemas/AdminUsageFunnel"
        navigationClickRanking:
          $ref: "#/components/schemas/AdminNavigationClickRanking"
      required: [usageFunnel, navigationClickRanking]

    AdminUsageFunnel:
      type: object
      properties:
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
            timezone:
              type: string
            bounds:
              type: string
              example: "inclusive [start, end] UTC"
          required: [start, end, timezone, bounds]
        coverage:
          type: object
          properties:
            documentationSources:
              type: array
              items: { type: string }
            clickSource:
              type: string
            documentationLimitations:
              type: array
              items: { type: string }
            start:
              type: ["string", "null"]
              format: date-time
            empty:
              type: boolean
            unavailableReason:
              type: string
          required: [documentationSources, clickSource, documentationLimitations, start, empty]
        activeDoctors:
          type: integer
        enteredWithoutDocumentationDoctors:
          type: integer
        documentedDoctors:
          type: integer
        enteredWithoutDocumentationDoctorList:
          type: array
          items:
            $ref: "#/components/schemas/AdminDoctorIdentity"
      required: [period, coverage, activeDoctors, enteredWithoutDocumentationDoctors, documentedDoctors, enteredWithoutDocumentationDoctorList]

    AdminDoctorIdentity:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
      required: [name, email]

    AdminNavigationClickRanking:
      type: object
      properties:
        bounds:
          type: string
          example: "inclusive [period.start, period.end] UTC"
        coverageStart:
          type: ["string", "null"]
          format: date-time
        empty:
          type: boolean
        unavailableReason:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              route:
                type: string
              feature:
                type: string
              count:
                type: integer
              uniqueDoctors:
                type: integer
            required: [route, feature, count, uniqueDoctors]
      required: [bounds, coverageStart, empty, items]

    RegisterDoctorBody:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
        senha:
          type: string
        estrangeiro:
          type: boolean
        paisOrigem:
          type: string
        crm:
          type: string
        crmEstado:
          type: string
        telefone:
          type: string
        cpf:
          type: string
        dataNascimento:
          type: string
          nullable: true
          description: Data de nascimento (YYYY-MM-DD)
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
        especialidade:
          type: string
        idioma:
          type: string
          enum: [pt-BR, es]
          default: pt-BR
      required: [nome, email, senha]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        senha:
          type: string
      required: [email, senha]

    AuthResponse:
      type: object
      properties:
        doctor:
          $ref: "#/components/schemas/Doctor"
      required: [doctor]

    Doctor:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        crm:
          type: string
        crmEstado:
          type: string
        telefone:
          type: ["string", "null"]
        cpf:
          type: string
        dataNascimento:
          type: ["string", "null"]
          description: Data de nascimento (YYYY-MM-DD)
        endereco:
          type: ["string", "null"]
        cidade:
          type: ["string", "null"]
        estado:
          type: ["string", "null"]
        cep:
          type: ["string", "null"]
        especialidade:
          type: ["string", "null"]
        idioma:
          type: string
          enum: [pt-BR, es]
          default: pt-BR
        whatsappBusiness:
          type: ["string", "null"]
          description: Número WhatsApp Business do médico (com DDD, somente dígitos)
        isAdmin:
          type: boolean
        createdAt:
          type: string
      required: [id, nome, email, crm, crmEstado, cpf, idioma, isAdmin, createdAt]

    UpdateDoctorBody:
      type: object
      properties:
        nome:
          type: string
        crm:
          type: string
        crmEstado:
          type: string
        telefone:
          type: string
        dataNascimento:
          type: string
          nullable: true
          description: Data de nascimento (YYYY-MM-DD)
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
        especialidade:
          type: string
        idioma:
          type: string
          enum: [pt-BR, es]
        whatsappBusiness:
          type: string
          nullable: true
          description: Número WhatsApp Business do médico (com DDD, somente dígitos)

    DoctorWithStats:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        crm:
          type: string
        crmEstado:
          type: string
        especialidade:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        totalPatients:
          type: integer
        totalSurgeries:
          type: integer
        createdAt:
          type: string
      required: [id, nome, email, crm, crmEstado, isAdmin, totalPatients, totalSurgeries, createdAt]

    AdminDoctorWithStats:
      allOf:
        - $ref: "#/components/schemas/DoctorWithStats"
        - type: object
          properties:
            aprovado:
              type: boolean
            isFree:
              type: boolean
            temporaryAccessExpiresAt:
              type: ["string", "null"]
            subscriptionStatus:
              type: ["string", "null"]
            subscriptionPeriodEnd:
              type: ["integer", "null"]
            lastLoginAt:
              type: ["string", "null"]
            lastActivityAt:
              type: ["string", "null"]
          required: [aprovado, isFree, temporaryAccessExpiresAt, subscriptionStatus, subscriptionPeriodEnd, lastLoginAt, lastActivityAt]

    Patient:
      type: object
      properties:
        id:
          type: integer
        doctorId:
          type: integer
        nome:
          type: string
        dataNascimento:
          type: ["string", "null"]
        sexo:
          type: ["string", "null"]
        telefone:
          type: ["string", "null"]
        lado:
          type: ["string", "null"]
        nivelAtividade:
          type: ["string", "null"]
        beightonScore:
          type: ["integer", "null"]
        createdAt:
          type: string
      required: [id, doctorId, nome, createdAt]

    PatientWithSurgeries:
      type: object
      properties:
        id:
          type: integer
        doctorId:
          type: integer
        nome:
          type: string
        dataNascimento:
          type: ["string", "null"]
        sexo:
          type: ["string", "null"]
        telefone:
          type: ["string", "null"]
        lado:
          type: ["string", "null"]
        nivelAtividade:
          type: ["string", "null"]
        beightonScore:
          type: ["integer", "null"]
        createdAt:
          type: string
        surgeries:
          type: array
          items:
            $ref: "#/components/schemas/Surgery"
      required: [id, doctorId, nome, createdAt, surgeries]

    CreatePatientBody:
      type: object
      properties:
        nome:
          type: string
        cpf:
          type: string
        dataNascimento:
          type: string
        email:
          type: string
        sexo:
          type: string
        telefone:
          type: string
        lado:
          type: string
        nivelAtividade:
          type: string
        beightonScore:
          type: integer
        planoSaude:
          type: string
        indicadoPor:
          type: string
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string
      required: [nome]

    UpdatePatientBody:
      type: object
      properties:
        nome:
          type: string
        cpf:
          type: string
        dataNascimento:
          type: string
        email:
          type: string
        sexo:
          type: string
        telefone:
          type: string
        lado:
          type: string
        nivelAtividade:
          type: string
        beightonScore:
          type: integer
        anamnese:
          type: string
          nullable: true
        laudos:
          type: string
          nullable: true
        planoSaude:
          type: string
        indicadoPor:
          type: string
        endereco:
          type: string
        cidade:
          type: string
        estado:
          type: string
        cep:
          type: string

    Surgery:
      type: object
      properties:
        regiao:
          type: ["string", "null"]
          enum: ["shoulder", "elbow", null]
        dadosClinicos:
          type: ["object", "null"]
          additionalProperties: true
        id:
          type: integer
        patientId:
          type: integer
        doctorId:
          type: integer
        dataCirurgia:
          type: ["string", "null"]
        hospital:
          type: ["string", "null"]
        tipoCaso:
          type: ["string", "null"]
        tiposProcedimento:
          type: array
          items:
            type: string
        procedimentoRealizado:
          type: ["string", "null"]
        observacoes:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, patientId, doctorId, tiposProcedimento, createdAt]

    SurgeryWithPatient:
      type: object
      properties:
        regiao:
          type: ["string", "null"]
          enum: ["shoulder", "elbow", null]
        dadosClinicos:
          type: ["object", "null"]
          additionalProperties: true
        id:
          type: integer
        patientId:
          type: integer
        doctorId:
          type: integer
        dataCirurgia:
          type: ["string", "null"]
        hospital:
          type: ["string", "null"]
        tipoCaso:
          type: ["string", "null"]
        tiposProcedimento:
          type: array
          items:
            type: string
        observacoes:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        createdAt:
          type: string
        patientNome:
          type: string
        patientSexo:
          type: ["string", "null"]
        patientLado:
          type: ["string", "null"]
      required: [id, patientId, doctorId, tiposProcedimento, createdAt, patientNome]

    SurgeryDetail:
      type: object
      properties:
        regiao:
          type: ["string", "null"]
          enum: ["shoulder", "elbow", null]
        dadosClinicos:
          type: ["object", "null"]
          additionalProperties: true
        id:
          type: integer
        patientId:
          type: integer
        doctorId:
          type: integer
        dataCirurgia:
          type: ["string", "null"]
        hospital:
          type: ["string", "null"]
        tipoCaso:
          type: ["string", "null"]
        tiposProcedimento:
          type: array
          items:
            type: string
        procedimentoRealizado:
          type: ["string", "null"]
        observacoes:
          type: ["string", "null"]
        diagnostico:
          type: ["string", "null"]
        createdAt:
          type: string
        patient:
          $ref: "#/components/schemas/Patient"
        followups:
          type: array
          items:
            $ref: "#/components/schemas/Followup"
      required: [id, patientId, doctorId, tiposProcedimento, createdAt, patient, followups]

    CreateSurgeryBody:
      type: object
      properties:
        regiao:
          type: ["string", "null"]
          enum: ["shoulder", "elbow", null]
        dadosClinicos:
          type: ["object", "null"]
          additionalProperties: true
          description: Dados clínicos de ombro/cotovelo (formato em @workspace/clinical surgery/payload.ts)
        patientId:
          type: integer
        dataCirurgia:
          type: string
        hospital:
          type: string
        tipoCaso:
          type: string
        tiposProcedimento:
          type: array
          items:
            type: string
        procedimentoRealizado:
          type: string
        observacoes:
          type: string
      required: [patientId, tiposProcedimento]

    UpdateSurgeryBody:
      type: object
      properties:
        regiao:
          type: ["string", "null"]
          enum: ["shoulder", "elbow", null]
        dadosClinicos:
          type: ["object", "null"]
          additionalProperties: true
          description: Dados clínicos de ombro/cotovelo (formato em @workspace/clinical surgery/payload.ts)
        dataCirurgia:
          type: string
        hospital:
          type: string
        lado:
          type: ["string", "null"]
        tipoCaso:
          type: string
        diagnostico:
          type: ["string", "null"]
        tiposProcedimento:
          type: array
          items:
            type: string
        procedimentoRealizado:
          type: string
        observacoes:
          type: string



















    CreateFollowupBody:
      type: object
      properties:
        surgeryId:
          type: integer
        tempo:
          type: string
        dataAvaliacao:
          type: string
        vasDor:
          type: ["number", "null"]
        admFlexao:
          type: ["integer", "null"]
        admExtensao:
          type: ["integer", "null"]
