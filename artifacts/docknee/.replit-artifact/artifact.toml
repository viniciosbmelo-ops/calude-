kind = "web"
previewPath = "/"
title = "DocKnee - Documentação Cirúrgica"
version = "1.0.0"
id = "artifacts/docknee"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20451

[services.development]
run = "pnpm --filter @workspace/docknee run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/docknee", "run", "build" ]
publicDir = "artifacts/docknee/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20451"
BASE_PATH = "/"
