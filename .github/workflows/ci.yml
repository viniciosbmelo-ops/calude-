name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PGURL: postgres://postgres:postgres@localhost:5432/postgres
      PGURL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm run setup
      - run: npm run typecheck
      - run: npm run lint:no-recommend
      - run: npx jest --coverage
      - name: Testes de RLS (SQL)
        run: ./db/test/run.sh

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SUPABASE_JWT_SECRET: ci-secret-with-at-least-32-characters-long
      DEV_LOGIN: '1'
      PORT: '3200'
      PUBLIC_BASE_URL: http://localhost:3200
      E2E_BASE_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run setup
      - run: npm run build
      - run: STANDALONE=1 ./db/setup.sh
      - run: npx playwright install --with-deps chromium
      - name: Sobe o app
        run: |
          nohup npm start > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3200/health && exit 0; sleep 1; done
          cat app.log; exit 1
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            app.log
